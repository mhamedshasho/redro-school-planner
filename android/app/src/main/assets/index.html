<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Redro School Planner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div><strong>Redro School Planner</strong><span>صانع البرنامج الأسبوعي</span></div>
  <div class="top-actions"><button id="printBtn">طباعة / PDF</button><button id="pngBtn">PNG</button></div>
</header>
<main>
<section class="panel controls">
  <label>اسم الطالب<input id="studentName" placeholder="اكتب اسمك"></label>
  <div class="control-row">
    <button id="addRow">+ صف</button><button id="delRow">− صف</button>
    <button id="addCol">+ عمود</button><button id="delCol">− عمود</button>
  </div>
  <div class="control-row">
    <button id="horizontal">أفقي</button><button id="vertical">عمودي</button>
    <label class="color">لون الجدول<input type="color" id="accent" value="#ef4444"></label>
    <button id="reset">إعادة ضبط</button>
  </div>
</section>
<section class="panel">
  <div class="schedule-head"><input id="title" value="البرنامج الأسبوعي"><span id="status">تم الحفظ</span></div>
  <div id="scheduleWrap"><table id="schedule"></table></div>
</section>
<section class="panel projects">
  <h2>مشاريعي</h2>
  <a class="project" href="https://aleppo-center-cash.vercel.app/" target="_blank" rel="noopener">
    <div class="project-icon">AC</div><div><strong>Aleppo Center Cash</strong><p>نظام إدارة الحسابات والمصروفات</p></div><span>↗</span>
  </a>
  <div class="project muted"><div class="project-icon">+</div><div><strong>مشروع جديد</strong><p>يمكن إضافة مشاريعك هنا لاحقاً</p></div></div>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
