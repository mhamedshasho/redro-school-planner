plugins { id "com.android.application" }
android {
 namespace "com.redro.schoolplanner"
 compileSdk 35
 defaultConfig { applicationId "com.redro.schoolplanner"; minSdk 23; targetSdk 35; versionCode 5; versionName "1.1.3" }
 signingConfigs {
   release {
     storeFile file("${rootProject.projectDir}/release.keystore")
     storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: "redro-school-planner"
     keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "redro"
     keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: "redro-school-planner"
   }
 }
 buildTypes {
   release {
     signingConfig signingConfigs.release
     minifyEnabled false
   }
 }
}